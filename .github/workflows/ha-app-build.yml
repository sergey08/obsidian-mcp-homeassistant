name: Home Assistant app image build
on:
  push:
    branches: [feature/fresh-install-onboarding]
    paths:
      - 'obsidian_suite/**'
      - '.github/workflows/ha-app-build.yml'
  pull_request:
    paths:
      - 'obsidian_suite/**'
      - '.github/workflows/ha-app-build.yml'
permissions:
  contents: read
jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build complete amd64 HA application image
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 --build-arg BUILD_VERSION=0.2.1 -t obsidian-mcp-ha-ci -f obsidian_suite/Dockerfile obsidian_suite
      - name: Validate packaged Python files and imported modules
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /opt/venv/bin/python obsidian-mcp-ha-ci -c "
          import ast,pathlib,sys
          sys.path.insert(0,'/opt/obsidian')
          for path in pathlib.Path('/opt/obsidian').glob('*.py'):
              ast.parse(path.read_text())
              print('OK',path.name)
          import onboarding, supervisor, settings_import, couchdb_check, preflight
          print('All onboarding modules import successfully')
          "

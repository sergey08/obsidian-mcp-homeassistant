name: Experimental preview image build
on:
  push:
    branches: [feature/fresh-install-onboarding]
    paths:
      - 'obsidian_preview/**'
      - '.github/workflows/preview-addon-build.yml'
permissions:
  contents: read
jobs:
  preview-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate preview isolation and build
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          c=Path('obsidian_preview/config.yaml').read_text()
          assert 'slug: "obsidian_preview"' in c
          assert 'all_app_configs' not in c
          assert 'options: {}' in c
          assert 'schema: {}' in c
          PY
          python3 -m py_compile obsidian_preview/onboarding.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'obsidian_preview')
          import onboarding
          status={k:False for k in ('vault','trash','sync_settings','sync_enabled','tunnel_binary','tunnel_key','tunnel_id','tunnel_enabled')}
          es=onboarding.render_page(status,lang='es')
          en=onboarding.render_page(status,lang='en')
          assert 'Configuración inicial' in es and 'Initial setup' in en
          assert 'type=\'password\'' in es
          assert 'name=\'csrf\'' in es
          assert 'name=\'lang\' value=\'es\'' in es
          assert 'test_couch_profile' in es and 'Probar conexión sin guardar' in es
          assert 'save_services' in es and 'Aplicar configuración de servicios' in es
          entered={'couch_url':'http://192.168.1.33:5984','couch_db':'obsidian','couch_user':'admin',
                   'couch_password':'secret"\'<x>','couch_passphrase':'test','couch_encrypted':'0'}
          persisted=onboarding.render_page(status,'Authentication failed',lang='es',entered=entered)
          assert 'http://192.168.1.33:5984' in persisted
          assert 'value=\'obsidian\'' in persisted
          assert '&lt;x&gt;' in persisted and '<x>' not in persisted
          assert 'name=\'couch_encrypted\' value=\'1\' checked' not in persisted
          print('Bilingual onboarding smoke test passed')
          PY
          python3 - <<'PY'
          import sys,tempfile,json
          from pathlib import Path
          sys.path.insert(0,'obsidian_preview')
          from livesync_setup import prepare_profile, save_profile, SetupError
          raw=prepare_profile('http://127.0.0.1:5984','test_notes','user','secret','passphrase',True)
          cfg=json.loads(raw)
          assert cfg['encrypt'] is True and cfg['couchDB_DBNAME']=='test_notes'
          assert cfg['liveSync'] is True and cfg['syncOnSave'] is True and cfg['syncOnStart'] is True
          with tempfile.TemporaryDirectory() as folder:
              save_profile('http://127.0.0.1:5984','test_notes','user','secret','passphrase',True,folder)
              assert (Path(folder)/'settings/livesync-operativo.json').exists()
              try:
                  save_profile('http://127.0.0.1:5984','test_notes','user','secret','passphrase',True,folder)
                  raise AssertionError('Overwrite accepted')
              except SetupError: pass
          try:
              prepare_profile('https://user:password@example.org','test_notes','u','p','',False)
              raise AssertionError('URL credentials accepted')
          except SetupError: pass
          print('Guided CouchDB profile smoke tests passed')
          PY
          python3 - <<'PY'
          import sys, json, urllib.error
          from unittest.mock import patch
          sys.path.insert(0, 'obsidian_preview')
          from couchdb_check import check_couchdb_values, CouchCheckError
          class Response:
              status=200
              def __enter__(self): return self
              def __exit__(self,*args): pass
              def read(self,size): return b'{"db_name":"test_notes"}'
          class Opener:
              def open(self,req,timeout=5):
                  assert req.get_method() == 'GET'
                  assert req.full_url == 'https://example.org/test_notes'
                  assert req.get_header('Authorization').startswith('Basic ')
                  return Response()
          config={'couchDB_URI':'https://example.org','couchDB_DBNAME':'test_notes',
                  'couchDB_USER':'user','couchDB_PASSWORD':'never-log-me'}
          with patch('couchdb_check.urllib.request.build_opener',return_value=Opener()):
              result=check_couchdb_values(config)
              assert 'reachable' in result
          assert 'never-log-me' not in result
          class Failed:
              def open(self,req,timeout=5):
                  raise urllib.error.HTTPError(req.full_url,401,'unauthorized',{},None)
          with patch('couchdb_check.urllib.request.build_opener',return_value=Failed()):
              try: check_couchdb_values(config)
              except CouchCheckError as exc: assert 'never-log-me' not in str(exc)
              else: raise AssertionError('Expected HTTP error')
          print('Read-only unsaved CouchDB connection checks passed')
          PY
          python3 - <<'PY'
          import tempfile,sys
          from pathlib import Path
          sys.path.insert(0,'obsidian_preview')
          from service_config import load,save,DEFAULT
          with tempfile.TemporaryDirectory() as d:
              base=Path(d)
              assert load(base)==DEFAULT
              v=save({'enable_livesync':False,'enable_tunnel':False,'livesync_interval':120,'tunnel_id':'dev-only'},base)
              assert load(base)==v
              assert (base/'service-config.json').stat().st_mode & 0o077==0
              try:
                  save({'enable_livesync':True,'enable_tunnel':False,'livesync_interval':10,'tunnel_id':''},base)
                  raise AssertionError('Invalid interval accepted')
              except ValueError: pass
          print('Service configuration storage checks passed')
          PY
          python3 - <<'PY'
          import tempfile,sys,json
          from pathlib import Path
          sys.path.insert(0,'obsidian_preview')
          from settings_import import import_settings_json,public_profile,update_profile
          import onboarding
          with tempfile.TemporaryDirectory() as d:
              base=Path(d)
              cfg={"couchDB_URI":"http://127.0.0.1:5984","couchDB_DBNAME":"obsidian","couchDB_USER":"admin","couchDB_PASSWORD":"secret","encrypt":True,"passphrase":"phrase"}
              import_settings_json(json.dumps(cfg).encode(),base)
              public=public_profile(base)
              assert "secret" not in repr(public) and public["has_passphrase"] is True
              status={k:False for k in ('vault','trash','sync_settings','sync_enabled','tunnel_binary','tunnel_key','tunnel_id','tunnel_enabled')}
              status['sync_settings']=True
              onboarding.DATA=base
              page=onboarding.render_page(status,lang='es')
              assert 'Guardar cambios' in page and 'http://127.0.0.1:5984' in page
              assert "value='secret'" not in page and "value='phrase'" not in page
              update_profile(base,{"couch_url":"http://127.0.0.1:5984","couch_db":"obsidian","couch_user":"admin","couch_encrypted":"1"})
              after=json.loads((base/'settings/livesync-operativo.json').read_text())
              assert after['couchDB_PASSWORD']=='secret' and after['passphrase']=='phrase'
          print('Safe editing existing CouchDB settings passed')
          PY
          docker build --platform linux/amd64 --build-arg BUILD_VERSION=0.3.0-dev9 -t obsidian-preview-ci -f obsidian_preview/Dockerfile obsidian_preview
      - name: Package experimental preview for manual installation
        run: |
          mkdir -p dist/obsidian_preview
          cp -a obsidian_preview/. dist/obsidian_preview/
          cd dist && zip -qr ../obsidian-preview-0.3.0-dev9.zip obsidian_preview
      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-preview-0.3.0-dev9
          path: obsidian-preview-0.3.0-dev9.zip
          retention-days: 7

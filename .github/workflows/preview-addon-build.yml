name: Experimental preview image build
on:
  push:
    branches: [feature/fresh-install-onboarding]
    paths:
      - 'obsidian_preview/**'
      - '.github/workflows/preview-addon-build.yml'
permissions:
  contents: read
jobs:
  preview-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate preview isolation and build
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          c=Path('obsidian_preview/config.yaml').read_text()
          assert 'slug: "obsidian_preview"' in c
          assert 'all_app_configs' not in c
          assert 'enable_livesync: false' in c
          assert 'enable_tunnel: false' in c
          PY
          python3 -m py_compile obsidian_preview/onboarding.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'obsidian_preview')
          import onboarding
          status={k:False for k in ('vault','trash','sync_settings','sync_enabled','tunnel_binary','tunnel_key','tunnel_id','tunnel_enabled')}
          es=onboarding.render_page(status,lang='es')
          en=onboarding.render_page(status,lang='en')
          assert 'Configuración inicial' in es and 'Initial setup' in en
          assert 'type=\'password\'' in es
          assert 'name=\'csrf\'' in es
          assert 'name=\'lang\' value=\'es\'' in es
          print('Bilingual onboarding smoke test passed')
          PY
          python3 - <<'PY'
          import sys,tempfile,json
          from pathlib import Path
          sys.path.insert(0,'obsidian_preview')
          from livesync_setup import prepare_profile, save_profile, SetupError
          raw=prepare_profile('http://127.0.0.1:5984','test_notes','user','secret','passphrase',True)
          cfg=json.loads(raw)
          assert cfg['encrypt'] is True and cfg['couchDB_DBNAME']=='test_notes'
          with tempfile.TemporaryDirectory() as folder:
              save_profile('http://127.0.0.1:5984','test_notes','user','secret','passphrase',True,folder)
              assert (Path(folder)/'settings/livesync-operativo.json').exists()
              try:
                  save_profile('http://127.0.0.1:5984','test_notes','user','secret','passphrase',True,folder)
                  raise AssertionError('Overwrite accepted')
              except SetupError: pass
          try:
              prepare_profile('https://user:password@example.org','test_notes','u','p','',False)
              raise AssertionError('URL credentials accepted')
          except SetupError: pass
          print('Guided CouchDB profile smoke tests passed')
          PY
          docker build --platform linux/amd64 --build-arg BUILD_VERSION=0.3.0-dev3 -t obsidian-preview-ci -f obsidian_preview/Dockerfile obsidian_preview
      - name: Package experimental preview for manual installation
        run: |
          mkdir -p dist/obsidian_preview
          cp -a obsidian_preview/. dist/obsidian_preview/
          cd dist && zip -qr ../obsidian-preview-0.3.0-dev3.zip obsidian_preview
      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-preview-0.3.0-dev3
          path: obsidian-preview-0.3.0-dev3.zip
          retention-days: 7

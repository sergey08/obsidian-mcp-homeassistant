name: LiveSync encrypted two-client replication
on:
  push:
    branches: [feature/fresh-install-onboarding]
    paths:
      - '.github/workflows/livesync-encrypted-replication.yml'
      - 'obsidian_suite/Dockerfile'
      - 'obsidian_preview/livesync_setup.py'
  pull_request:
    paths:
      - '.github/workflows/livesync-encrypted-replication.yml'
      - 'obsidian_suite/Dockerfile'
permissions:
  contents: read
jobs:
  replication:
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3
        ports: ['5984:5984']
        env:
          COUCHDB_USER: ciadmin
          COUCHDB_PASSWORD: cipassword
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable database and isolated clients
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS -u ciadmin:cipassword http://127.0.0.1:5984/_up >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS -u ciadmin:cipassword -X PUT http://127.0.0.1:5984/livesync_encrypted_ci
          mkdir -p /tmp/livesync-encrypted-ci/{client-a,client-b,vault-a,vault-b,private-a,private-b}
          python3 - <<'PY'
          import json,pathlib,sys
          sys.path.insert(0, 'obsidian_preview')
          from livesync_setup import prepare_profile
          # Exercise exactly the JSON emitted by the guided preview form.
          # Previous independently handcrafted fixture intentionally removed.
          config=json.loads(prepare_profile('http://127.0.0.1:5984', 'livesync_encrypted_ci', 'ciadmin', 'cipassword', 'ci-test-only-encryption-passphrase', True))
          for name in ['a','b']:
              dest=pathlib.Path('/tmp/livesync-encrypted-ci')/('private-'+name)/'settings.json'
              dest.write_text(json.dumps(config))
          print('Using guided-preview generated encrypted configuration')
          PY
          printf 'Test note from disposable client A\n' > /tmp/livesync-encrypted-ci/vault-a/note.md
      - name: Push from A, sync through CouchDB, pull using B
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=$(sed -n 's/^FROM //p' obsidian_suite/Dockerfile | head -n 1)
          docker pull "$IMAGE"
          cli() {
            local db_path="$1"
            shift
            docker run --rm --network host \
              -v /tmp/livesync-encrypted-ci:/encrypted-ci -e LIVESYNC_DB_PATH="$db_path" \
              --entrypoint /usr/local/bin/livesync-cli "$IMAGE" "$@"
          }
          # Exercise the production daemon initial scan instead of relying on mirror alone.
          set +e
          timeout --signal=TERM 15s docker run --rm --network host \
            -v /tmp/livesync-encrypted-ci:/encrypted-ci -e LIVESYNC_DB_PATH=/encrypted-ci/client-a \
            --entrypoint /usr/local/bin/livesync-cli "$IMAGE" \
            --settings /encrypted-ci/private-a/settings.json --vault /encrypted-ci/vault-a
          rc=$?
          set -e
          echo "Daemon exit status: $rc"
          if [[ "$rc" != "0" && "$rc" != "124" && "$rc" != "143" ]]; then
            echo "::error::LiveSync daemon exited unexpectedly (status $rc)"
            exit 1
          fi
          echo "Verify initial mirror populated client A before attempting network replication"
          cli /encrypted-ci/client-a --settings /encrypted-ci/private-a/settings.json ls > /tmp/livesync-a-list.txt
          if ! grep -q "note.md" /tmp/livesync-a-list.txt; then
            echo "::error::Initial mirror did not import note.md to client A. Investigate settings/file selection before network replication."
            exit 1
          fi
          cli /encrypted-ci/client-a --settings /encrypted-ci/private-a/settings.json sync
          cli /encrypted-ci/client-b --settings /encrypted-ci/private-b/settings.json sync
          cli /encrypted-ci/client-b --settings /encrypted-ci/private-b/settings.json mirror /encrypted-ci/vault-b
          echo "Inspecting test vault structure and LiveSync local metadata (no secrets):"
          find /tmp/livesync-encrypted-ci/vault-a /tmp/livesync-encrypted-ci/vault-b -maxdepth 3 -type f -printf "%p\\n"
          cli /encrypted-ci/client-a --settings /encrypted-ci/private-a/settings.json ls || true
          cli /encrypted-ci/client-b --settings /encrypted-ci/private-b/settings.json ls || true
          cmp /tmp/livesync-encrypted-ci/vault-a/note.md /tmp/livesync-encrypted-ci/vault-b/note.md
          echo "Verified A → CouchDB → B on disposable encrypted settings data"
          printf 'Test note from disposable client B\n' > /tmp/livesync-encrypted-ci/vault-b/from-b.md
          cli /encrypted-ci/client-b --settings /encrypted-ci/private-b/settings.json mirror /encrypted-ci/vault-b
          cli /encrypted-ci/client-b --settings /encrypted-ci/private-b/settings.json sync
          cli /encrypted-ci/client-a --settings /encrypted-ci/private-a/settings.json sync
          cli /encrypted-ci/client-a --settings /encrypted-ci/private-a/settings.json mirror /encrypted-ci/vault-a
          cmp /tmp/livesync-encrypted-ci/vault-b/from-b.md /tmp/livesync-encrypted-ci/vault-a/from-b.md
          echo "Verified B → CouchDB → A on disposable encrypted settings data"
          printf 'Updated note from disposable client A\n' > /tmp/livesync-encrypted-ci/vault-a/note.md
          cli /encrypted-ci/client-a --settings /encrypted-ci/private-a/settings.json mirror /encrypted-ci/vault-a
          cli /encrypted-ci/client-a --settings /encrypted-ci/private-a/settings.json sync
          cli /encrypted-ci/client-b --settings /encrypted-ci/private-b/settings.json sync
          cli /encrypted-ci/client-b --settings /encrypted-ci/private-b/settings.json mirror /encrypted-ci/vault-b
          cmp /tmp/livesync-encrypted-ci/vault-a/note.md /tmp/livesync-encrypted-ci/vault-b/note.md
          echo "Verified updated content A → CouchDB → B"
          # Inspect remote document JSON and verify no plain Markdown content is stored.
          # These test-only credentials belong to the disposable CouchDB service.
          curl --fail --silent -u ciadmin:cipassword \
            'http://127.0.0.1:5984/livesync_encrypted_ci/_all_docs?include_docs=true' \
            > /tmp/livesync-remote.json
          python3 - <<'PY'
          from pathlib import Path
          remote=Path('/tmp/livesync-remote.json').read_text()
          for phrase in (
              'Test note from disposable client A',
              'Test note from disposable client B',
              'Updated note from disposable client A'
          ):
              if phrase in remote:
                  raise SystemExit('ERROR: Plain Markdown content visible in remote CouchDB documents')
          print('No test Markdown plaintext exposed in remote CouchDB JSON documents')
          PY

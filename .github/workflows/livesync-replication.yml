name: LiveSync isolated two-client replication
on:
  push:
    branches: [feature/fresh-install-onboarding]
    paths:
      - '.github/workflows/livesync-replication.yml'
      - 'obsidian_suite/Dockerfile'
  pull_request:
    paths:
      - '.github/workflows/livesync-replication.yml'
      - 'obsidian_suite/Dockerfile'
permissions:
  contents: read
jobs:
  replication:
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3
        ports: ['5984:5984']
        env:
          COUCHDB_USER: ciadmin
          COUCHDB_PASSWORD: cipassword
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable database and isolated clients
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS -u ciadmin:cipassword http://127.0.0.1:5984/_up >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS -u ciadmin:cipassword -X PUT http://127.0.0.1:5984/livesync_ci
          mkdir -p /tmp/livesync-ci/{client-a,client-b}
          python3 - <<'PY'
          import json,pathlib
          config={
              'couchDB_URI':'http://127.0.0.1:5984',
              'couchDB_USER':'ciadmin',
              'couchDB_PASSWORD':'cipassword',
              'couchDB_DBNAME':'livesync_ci',
              'isConfigured':True,
              'encrypt':False,
              'remoteType':'CouchDB'
          }
          for name in ['client-a','client-b']:
              dest=pathlib.Path('/tmp/livesync-ci')/name/'settings.json'
              dest.write_text(json.dumps(config))
          PY
          printf 'Test note from disposable client A\n' > /tmp/livesync-ci/note.md
      - name: Push from A, sync through CouchDB, pull using B
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=$(sed -n 's/^FROM //p' obsidian_suite/Dockerfile | head -n 1)
          docker pull "$IMAGE"
          cli() {
            docker run --rm --network host \
              -v /tmp/livesync-ci:/ci \
              --entrypoint /usr/local/bin/livesync-cli "$IMAGE" "$@"
          }
          cli /ci/client-a --settings /ci/client-a/settings.json push /ci/note.md test/note.md
          cli /ci/client-a --settings /ci/client-a/settings.json sync
          cli /ci/client-b --settings /ci/client-b/settings.json sync
          cli /ci/client-b --settings /ci/client-b/settings.json pull test/note.md /ci/pulled.md
          cmp /tmp/livesync-ci/note.md /tmp/livesync-ci/pulled.md
          echo "Verified A → CouchDB → B on disposable unencrypted data"

name: "Obsidian MCP Suite (Preview)"
version: "0.1.1"
slug: "obsidian_suite"
description: "Unified MCP server, ChatGPT tunnel and LiveSync bridge"
arch:
  - amd64
startup: application
boot: manual
init: false
map:
  - type: all_app_configs
    read_only: false
options:
  tunnel_id: ""
  enable_tunnel: true
  enable_livesync: true
  livesync_interval: 60
schema:
  tunnel_id: str
  enable_tunnel: bool
  enable_livesync: bool
  livesync_interval: int(30,3600)

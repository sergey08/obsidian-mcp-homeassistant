name: "Obsidian MCP for Home Assistant"
version: "0.2.2-dev1"
slug: "obsidian_suite"
description: "One Home Assistant app for Obsidian notes, ChatGPT MCP access and LiveSync synchronization"
url: "https://github.com/sergey08/obsidian-mcp-homeassistant"
arch:
  - amd64
startup: application
boot: manual
init: false
map:
  - type: all_app_configs
    read_only: false
options:
  tunnel_id: ""
  enable_tunnel: false
  enable_livesync: false
  livesync_interval: 60
  couchdb_url: ""
  couchdb_database: "obsidian"
  couchdb_username: ""
  couchdb_password: ""
  livesync_encryption: true
  livesync_passphrase: ""
schema:
  tunnel_id: str
  enable_tunnel: bool
  enable_livesync: bool
  livesync_interval: int(30,3600)
  couchdb_url: str?
  couchdb_database: str
  couchdb_username: str?
  couchdb_password: password?
  livesync_encryption: bool
  livesync_passphrase: password?
